<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Github Issues Tracker | Login</title>
    <link rel="shortcut icon" href="assets/github-logo.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
<style>
    *{
        font-family: "Geist", sans-serif;
    }
</style>
</head>

<body class="bg-[#F8FAFC] min-h-screen">
    <header class="mx-auto">
        <div class="navbar bg-base-100 shadow-sm w-full px-20">
  <div class="flex-1">
    <div class="flex"> 
        <img class="w-[36px] h-[37px]" src="assets/github-logo.png" alt="">
    <a class="btn btn-ghost text-xl">GitHub Issues Tracker </a></div>
   
  </div>
  <div class="flex gap-2">
    <div class="flex items-center gap-2 border border-gray-200 rounded-md px-2">
  <i class="fa-solid fa-magnifying-glass text-gray-400"></i>
  <input id="search-input" type="text" placeholder="Search issues..." class="input border-0 focus:outline-none" />
</div>
        <button id="search-btn" class="btn btn-md btn-primary">Search</button>
    </div>
  </div>
    </header>
<section id="filter-btn" class="flex justify-center mt-10">

  <div class="w-[80%] bg-white border border-gray-200 rounded-md gap-10 shadow-sm">



     <div id="status-tabs" class="flex bg-base-100 p-4 gap-5 justify-center md:justify-start">
            <button value="all" class="status-btn btn btn-primary md:w-28" type="button">All</button>
            <button value="open" class="status-btn btn md:w-28" type="button">Open</button>
            <button value="closed" class="status-btn md:w-28 btn" type="button">Closed</button>
        </div>


  </div>

</section>

<section id="total-issues">
  <div class="w-[80%] bg-white border border-gray-200 rounded-md p-6 gap-10 shadow-sm flex justify-between mt-4 mx-auto">
    <div class="flex gap-1 items-center">
      <img class="h-[32px] w-[32px]"src="assets/Aperture.png" alt="">
      <div>
        <h1 id="issueNum" class="font-semibold text-[#1F2937] text-xl"></h1>
      <p class="text-xs text-[#64748B]">Track and manage your project issues</p>
      </div>
      
    </div>
    <div class="flex gap-4 items-center">
      <div class="flex gap-1">
        <img class="h-[45%] w-[45%]" src="assets/open-Status.png" alt="">
        <span class="font-medium text-[16px] text-[#1F2937]">Open</span>
      </div>
      <div class="flex gap-1">
        <img class="h-[45%] w-[45%]" src="assets/closed-status.png" alt="">
        <span class="font-medium text-[16px] text-[#1F2937]">Close</span>
      </div>
    </div>
    </div>
</section>

<section id="cardContainer" class="w-[80%] mx-auto my-2 grid grid-cols-1 md:grid-cols-3 gap-5 sm:grid grid-rows-2">
  

</section>

<section>
            <!-- Open the modal using ID.showModal() method -->
            <dialog id="issue_details" class="modal">
                <div class="modal-box">
                    
                        <div id="details-container"></div>

                        <form method="dialog">
                            <!-- if there is a button in form, it will close the modal -->
                            <button class="btn btn-primary">Close</button>
                        </form>
                    </div>
                </div>
            </dialog>
         </section>
         
    </section>
<script src="main.js"></script>
</body>
</html>
